### model
model_name_or_path: ./models/DeepSeek-R1-Distill-Llama-8B
adapter_name_or_path: ./outputs/r1-distill-llama-8b_s1
trust_remote_code: false

### method
stage: sft
do_train: true
do_eval: false
finetuning_type: moe
deepspeed: ./setup/ds_config_zero3.json

### dataset
dataset: star_cot,star_cot_eval,star_cot_anchor  # 1,000 harmful + 915 benign (stage 2)
dataset_dir: ./LLaMA-Factory/data
template: deepseek3
cutoff_len: 10240
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: ./outputs/r1-distill-llama-8b_s2
logging_steps: 1
save_steps: 50000
plot_loss: true
overwrite_output_dir: true
print_param_status: true

### train
train_only_router: true             # stage 2 trains only the routers (soft guardrail)
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
num_train_epochs: 10
save_total_limit: 2
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000
report_to: tensorboard
sg_loss_coef: 0.1
layers_to_moe: 13,17,18
moe_num_experts: 4
topk: 2
disable_gradient_checkpointing: true
