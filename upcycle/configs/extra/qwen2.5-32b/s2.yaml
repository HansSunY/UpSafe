### model
model_name_or_path: ./models/Qwen2.5-32B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
do_eval: false
finetuning_type: moe
deepspeed: ./setup/ds_config_zero3.json

### dataset
dataset: star,star_eval,star_anchor
dataset_dir: ./LLaMA-Factory/data
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: ./outputs/qwen2.5-32b_s2
logging_steps: 1
save_steps: 50
plot_loss: true
overwrite_output_dir: true
print_param_status: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
num_train_epochs: 10
save_total_limit: 2
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000
report_to: tensorboard
sg_loss_coef: 0.1
train_only_router: true
layers_to_moe: 41,43,44
moe_num_experts: 4
topk: 2
disable_gradient_checkpointing: true
