### model
model_name_or_path: ./models/DeepSeek-R1-Distill-Qwen-14B
trust_remote_code: true

### method
stage: sft
do_train: true
do_eval: false
finetuning_type: moe
deepspeed: ./setup/ds_config_zero3.json

### dataset
dataset: star_cot,star_cot_eval       # 1,000 harmful samples w/ safety reasoning (stage 1)
dataset_dir: ./LLaMA-Factory/data
template: deepseek3
cutoff_len: 10240
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: ./outputs/r1-distill-qwen-14b_s1
logging_steps: 1
save_steps: 50
plot_loss: true
overwrite_output_dir: true
print_param_status: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
num_train_epochs: 20
save_total_limit: 5
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000
report_to: tensorboard
aux_loss_coef: 0.01
layers_to_moe: 23,24,26              # from the instruction-tuned counterpart (Qwen2.5 parent)
moe_num_experts: 4
topk: 2
disable_gradient_checkpointing: true
