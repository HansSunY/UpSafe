### model
model_name_or_path: ./models/Llama-3.1-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
do_eval: false
finetuning_type: lora
lora_target: all
deepspeed: ./setup/ds_config_zero3.json

### dataset  # full STAR-1 training set (all 1,915 samples)
dataset: star,star_eval,star_anchor
dataset_dir: ./LLaMA-Factory/data
template: llama3
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: ./outputs/llama3.1-8b_sft_lora
logging_steps: 1
save_steps: 50
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
num_train_epochs: 30
save_total_limit: 5
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000
report_to: tensorboard
disable_gradient_checkpointing: true
